name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Dockerfile', 'railway/**', '.github/workflows/publish-ghcr.yml']
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/onepush-dev/silo-server
            org.opencontainers.image.description=Railway packaging of the official Silo omnibus image (build-2069) with a first-admin gate
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          tags: |
            ghcr.io/onepush-dev/silo-server:latest
            ghcr.io/onepush-dev/silo-server:build-2069-r1
          platforms: linux/amd64
